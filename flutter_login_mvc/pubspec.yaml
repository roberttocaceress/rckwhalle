name: rcksistemas_login
description: RCK Sistemas - Login Module Flutter MVC

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  retrofit: ^4.2.0
  retrofit_generator: ^7.0.0
  dio: ^5.0.0
  shared_preferences: ^2.1.0
  local_auth: ^2.1.1
  connectivity_plus: ^3.0.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

